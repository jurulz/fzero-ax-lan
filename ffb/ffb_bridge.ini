# Force feedback bridge settings (F-Zero AX / Dolphin -> vJoy). Decimal point notation.
tcp_port = 8000            # Dolphin outputs port
device_name = vJoy         # part of the device name (list: DolphinFFBBridge.exe --list)
device_index = -1          # or exact device number (-1 = use device_name)
axis = 0                   # wheel axis: 0 = X, 1 = Y, 2 = Z ...
servo_scale = 50           # WheelServo value matching the wheel end stop (measured: -50 to +51)
kp = 3.0                  # gain: higher = the wheel is pulled harder toward the target
kd = 0.12                 # damping: higher = fewer oscillations
max_force = 0.35          # 0 to 1: force CEILING. Start low (0.2) then increase.
slew_per_cycle = 0.08      # max force change every 10 ms (smooths jolts)
curve = 1.0                # 0.2 to 1: lower = small forces are amplified (1 = linear)
min_force = 0.0            # 0 to 0.5: minimum force as soon as there is an order (overcomes motor friction)
invert_force = 0           # set to 1 if the wheel is pushed the wrong way (see --test)
invert_position = 0        # set to 1 if the wheel axis is reversed
init_force = 0             # 1 = also during 'Motor Initializing' (the wheel sweeps its whole travel)
start_enabled = 1          # 0 = start with the force cut (Space to enable it)
